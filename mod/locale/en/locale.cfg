ai-monitoring-station=AI Monitoring Station

[entity-description]
ai-monitoring-station=An armored mobile observation bunker. Step inside (Enter) to shelter and view the AI worker via live CCTV, monitor factory triage, and issue remote directives.

[item-name]
ai-monitoring-station=AI Monitoring Station

[item-description]
ai-monitoring-station=Deployable observation bunker equipped with live AI CCTV spectator tracking and remote command telemetry.

