[mod-name]
ai-player-v3=AI Player v3 (skills)

[mod-description]
ai-player-v3=Skill-based autonomous AI player for Factorio 2.1 (Space Age aware), driven by an external Python bridge over RCON.

[controls]
ai-player-toggle-panel=Toggle AI player panel

[mod-setting-name]
ai-player-lm-studio-url=LM Studio / local URL
ai-player-model-name=Model name
ai-player-provider=AI provider
ai-player-openai-api-key=OpenAI API key
ai-player-openai-api-base=OpenAI API base URL
ai-player-custom-url=Custom endpoint URL
ai-player-rcon-host=RCON host
ai-player-rcon-port=RCON port
ai-player-rcon-password=RCON password
ai-player-tick-interval=Think interval (ticks)
ai-player-vision-radius=Vision radius (tiles)
ai-player-enable-chat=Enable chat commands
ai-player-auto-respawn=Auto-respawn AI character
ai-player-debug-chat=Debug messages in chat
ai-player-debug-log=Write debug log (debug.jsonl)

[mod-setting-description]
ai-player-lm-studio-url=Ignored when the bridge's .env sets LM_STUDIO_URL.
ai-player-model-name=Ignored when the bridge's .env sets AI_MODEL.
ai-player-provider=Ignored when the bridge's .env sets AI_PROVIDER.
ai-player-openai-api-key=Only for the OpenAI provider. Stored in the save's config output, so prefer the bridge's .env.
ai-player-rcon-password=Leave empty and keep the password in the bridge's .env.
ai-player-tick-interval=How often the AI asks the bridge for its next move. 60 ticks = 1 second.
ai-player-vision-radius=How far around the AI character it scans for entities and resources.
ai-player-debug-log=Writes script-output/ai-player/debug.jsonl, read by python -m bridge.diag.
